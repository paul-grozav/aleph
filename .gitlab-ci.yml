image: debian:10.10

build_squashfs:
  stage: build
  tags:
    - docker
    - linux
  script:
    - ./aleph.sh --core__build
  artifacts:
    paths:
      - public/distribution_content/filesystem.squashfs
    expire_in: 1 hour
      # depending on your build setup it's most likely a good idea to cache outputs to reduce the build time
      # cache:
      #   paths:
      #     - "*.o"

pages:
  stage: deploy
  needs: ["build_squashfs"]
  script:
    - echo "Nothing to do..."
  artifacts:
    paths:
      - public/
    expire_in: 1 hour
