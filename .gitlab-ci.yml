image: debian:10.10

build_pxe_squashfs:
  stage: build
  tags:
    - docker
    - linux
  script:
    - ./aleph.sh --core__build
  artifacts:
    paths:
      - distribution_content/filesystem.squashfs
    expire_in: 1 hour
      # depending on your build setup it's most likely a good idea to cache outputs to reduce the build time
      # cache:
      #   paths:
      #     - "*.o"

pages:
  stage: deploy
  needs: ["build_pxe_squashfs"]
  script:
    - mv distribution_content public/distribution_content
  artifacts:
    paths:
      - public/
    expire_in: 1 hour
