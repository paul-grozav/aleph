name: Build Aleph GNU/Linux distribution binary files
on:
  push:
    branches:
    - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
env:
  LC_ALL: C.UTF-8
jobs:
  # Build job
  core__build:
    # Uses a free GitHub runner
    runs-on: ubuntu-latest
    container:
      image: debian:13.5
    steps:
    # Must install git before checkout, otherwise .git folder is missing and
    # will just use REST API (download .zip of repo)
    - name: Install tools
      run: |
        set -x &&
        export DEBIAN_FRONTEND=noninteractive &&
        apt-get update &&
        apt-get install -y \
          ` # tar - to create the artifact ` \
          tar \
          ` # To check changes in prev commit(s) ` \
          git \
          &&
        true
    - name: Checkout
      uses: actions/checkout@v4
      # with:
      #   fetch-depth: 1
    # Add this step to fix the "dubious ownership" error
    - name: Trust Workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: pxe_kernel
      run: |
        set -x &&
        ./aleph.sh --core__build__pxe_kernel &&
        true
    - name: squashfs
      run: |
        set -x &&
        ./aleph.sh --core__build__squashfs &&
        true
    - name: iso
      run: |
        set -x &&
        ./aleph.sh --core__build__iso &&
        true
    - name: publish
      run: |
        set -x &&
        ./aleph.sh --core__publish &&
        true
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload static files as artifact
      id: deployment
      uses: actions/upload-pages-artifact@v4
      with:
        path: public
        retention-days: 1
  deploy:
    environment:
      name: aleph-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Uses a free GitHub runner
    runs-on: ubuntu-latest
    needs: core__build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
# ============================================================================ #
